<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
	  xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
	  xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
	  xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
	  xmlns:gd="http://typo3.org/ns/ElementareTeilchen/Groupdelegation/ViewHelpers">

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="tx_groupdelegation.title" /></h1>

    <f:if condition="{isSubAdmin}">
        <f:then>
            <h2 class="d-flex align-items-center gap-2"><be:avatar backendUser="{user.uid}" showIcon="1" /> <span>{user.username} - {user.realName} [{user.uid}]</span></h2>

            <f:form action="save" controller="Backend" name="editUser">
                <f:form.hidden name="userId" value="{user.uid}"/>
                <f:if condition="{canActivateUsers}">
                    <fieldset class="form-section">
                        <legend class="form-section-headline"><f:translate key="tx_groupdelegation.activationSettings" /></legend>
                        <div class="form-check">
                            <f:form.checkbox id="disable" name="disable" value="1" class="form-check-input" checked="{user.disable} == 1" />
                            <label class="form-check-label" for="disable">
                                <f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:disable"/>
                            </label>
                        </div>
                        <f:if condition="{editableStartStopTime}">
                            <div class="form-row mt-3">
                                <div class="form-group">
                                    <label class="form-label" for="starttime"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.starttime"/></label>
                                    <f:form.textfield id="starttime" name="starttime" type="date" class="form-control" value="{f:if(condition: user.starttime, then: '{user.starttime -> f:format.date( format: \'Y-m-d\' )}', else: '')}" placeholder="JJJJ-MM-DD" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="endtime"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.endtime"/></label>
                                    <f:form.textfield id="endtime" name="endtime" type="date" class="form-control" value="{f:if(condition: user.endtime, then: '{user.endtime -> f:format.date( format: \'Y-m-d\' )}', else: '')}" placeholder="JJJJ-MM-DD" />
                                </div>
                            </div>
                        </f:if>
                    </fieldset>
                </f:if>

                <fieldset class="form-section">
                    <legend class="form-section-headline"><f:translate key="tx_groupdelegation.groupAssignment" /></legend>
                    <f:for each="{delegatableGroupsOfUser}" as="delgroup" key="delGroupId">
                        <div class="form-check">
                            <f:form.checkbox name="groups[]" id="groups-{delGroupId}" value="{delGroupId}" class="form-check-input" checked="{gd:InArray(needle:'{delGroupId}', haystack:'{usergroups}')} == true" />
                            <label class="form-check-label" for="groups-{delGroupId}">{delgroup}</label>
                        </div>
                    </f:for>
                </fieldset>

                <div class="d-flex gap-2">
                    <f:link.action action="index" class="btn btn-default">
                        <core:icon identifier="actions-close" size="small" />
                        {f:translate(key:'tx_groupdelegation.close')}
                    </f:link.action>
                    <f:form.button type="submit" class="btn btn-primary">
                        <core:icon identifier="actions-document-save" size="small" />
                        {f:translate(key:'tx_groupdelegation.save')}
                    </f:form.button>
                </div>
            </f:form>
        </f:then>

        <f:else>
            <h2><f:translate key="tx_groupdelegation.isNoMemberOfSubAdminGroup_Title" /></h2>
            <f:translate key="tx_groupdelegation.isNoMemberOfSubAdminGroup_Message" />
        </f:else>
    </f:if>
</f:section>
</html>
