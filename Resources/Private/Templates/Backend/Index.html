<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
	  xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
	  xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
	  xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers">

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="tx_groupdelegation.title" /></h1>
    <f:if condition="{isSubAdmin}">
        <f:then>
            <h2><f:translate key="tx_groupdelegation.userlisting"/></h2>

            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th class="col-icon"></th>
                            <th><f:translate key="tx_groupdelegation.username" /></th>
                            <th><f:translate key="tx_groupdelegation.realname" /></th>
                            <th><f:translate key="tx_groupdelegation.overview_delegatable" /></th>
                            <th><f:translate key="tx_groupdelegation.overview_not_delegatable" /></th>
                            <th class="col-control"><span class="visually-hidden"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels._CONTROL_" /></span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{users}" as="user">
                            <tr>
                                <td class="col-icon">
                                    <be:avatar backendUser="{user.uid}" showIcon="1" />
                                </td>
                                <td>
                                    <f:link.action action="edit" controller="Backend" arguments="{userId: user.uid}">{user.username}</f:link.action>
                                </td>
                                <td>
                                    {user.realName}
                                </td>
                                <td>
                                    <f:for each="{user.groups.hasDelegatable}" as="group">
                                        {group}<br />
                                    </f:for>
                                </td>
                                <td>
                                    <f:for each="{user.groups.hasNotDelegatable}" as="group">
                                        {group}<br />
                                    </f:for>
                                </td>
                                <td class="col-control">
                                    <div class="btn-group" role="group">
                                        <f:link.action action="edit" controller="Backend" arguments="{userId: user.uid}" class="btn btn-default" title="{f:translate(key:'tx_groupdelegation.edituser')}">
                                            <core:icon identifier="actions-open" />
                                            <span class="visually-hidden"><f:translate key="tx_groupdelegation.edituser" /></span>
                                        </f:link.action>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <h2><f:translate key="tx_groupdelegation.isNoMemberOfSubAdminGroup_Title" /></h2>
            <f:translate key="tx_groupdelegation.isNoMemberOfSubAdminGroup_Message" />
        </f:else>
    </f:if>
</f:section>

</html>
